# declaration et configuration des services.

services:

  mariadb:
    build: ./requirements/mariadb
    image: mariadb:42
    container_name: mariadb
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    # volumes : refers to this or that volume declared in section "volumes"
    # we tell the service which volume its gonna use.
    #[nom_du_volume]:[chemin_dans_le_conteneur]
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_net
    secrets:
      - db_password
      - db_root_password

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:42
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - WORDPRESS_DB_HOST=${WORDPRESS_DB_HOST}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - SITE_TITLE=${SITE_TITLE}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_EMAIL=${WP_EMAIL}
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_net
    secrets:
      - db_password
      - wp_admin_password
      - wp_password

  nginx:
    build: ./requirements/nginx
    image: nginx:42
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    depends_on:
      - wordpress
    networks:
      - inception_net


# declaration et configuration des volumes.

volumes:   

  mariadb_data:                              # Name. Will be used somewhere in "services" up there.
    name: mariadb_data                       # (optional)Name, forces this name without the automatic prefix "[parent]"
    driver: local                            # <-- 1. Définit le pilote natif de Docker
    driver_opts:
      type: none                             # <-- 2. Pas de type de système de fichiers particulier
      o: bind                                # <-- 3. L'OPTION CRUCIALE : ordonne un montage de type "bind" 
      device: /home/csimonne/data/mariadb    # <-- 4. LA LIGNE CLÉ : le chemin cible sur l'hôte

  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/csimonne/data/wordpress


# declaration et configuration des networks.

networks:

  inception_net:
    name: inception_net
    driver: bridge


# declaration des secrets.

secrets:

  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_password:
    file: ../secrets/wp_password.txt