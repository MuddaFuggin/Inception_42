# declaration and configuration of services.

services:

  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_net
    secrets:
      - db_password
      - db_root_password

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb                          # Defines launching order
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - WORDPRESS_DB_HOST=${WORDPRESS_DB_HOST}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - SITE_TITLE=${SITE_TITLE}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_EMAIL=${WP_EMAIL}
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_net
    secrets:
      - db_password
      - wp_admin_password
      - wp_password

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: always
    ports:
      - "443:443"                          # Only port allowed to exterior
    volumes:
      - wordpress_data:/var/www/html
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    depends_on:
      - wordpress
    networks:
      - inception_net


# declaration and configuration of volumes.

volumes:   

  mariadb_data:                              # Name. Will be used somewhere in "services" up there.
    name: mariadb_data                       # (optional) Name, forces this name without the automatic prefix "[parent]"
    driver: local                            # <--  Defines Docker native pilot.
    driver_opts:
      type: none                             
      o: bind                                # <-- mounting of "bind" type.
      device: ${DATA_PATH}/mariadb    # <-- target path on host.

  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress


# declaration and configuration of networks.

networks:

  inception_net:
    name: inception_net
    driver: bridge


# declaration of secrets.

secrets:

  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_password:
    file: ../secrets/wp_password.txt
